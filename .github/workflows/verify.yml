name: Reproduce analysis checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python run.py core --output ../core_results
      - run: python run.py distribution --output ../distribution_results
      - run: python run.py simulation --reps 8 --output ../simulation_results
